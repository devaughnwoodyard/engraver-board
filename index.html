<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ivelisse Board</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ivelisse">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Simonetta&family=Raleway:wght@400;500;600&family=Great+Vibes&display=swap">
<style>
:root{--bg:#fff;--ink:#2b2b2b;--muted:#6e625b;--line:#e6e0db;--accent:#8a5341;--rose:#be836f;--cream:#fff8f0;--ok:#2e6b48;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Raleway,system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding-top:var(--safe-t);padding-bottom:var(--safe-b);overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{color:var(--accent)}
img{max-width:100%;display:block}
.serif{font-family:Simonetta,serif;font-weight:400}
.script{font-family:'Great Vibes',cursive}
.label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
.wrap{max-width:520px;margin:0 auto;padding:20px 22px 40px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px}
.top .brand{font-family:Simonetta,serif;font-size:19px;white-space:nowrap}
.top .meta{font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;text-align:right}
h1{font-family:Simonetta,serif;font-weight:400;font-size:34px;line-height:1.05;margin:0 0 18px}
h2{font-family:Simonetta,serif;font-weight:400;font-size:24px;margin:0}
.step{margin:22px 0}
.rows button{width:100%;min-height:52px;background:none;border:0;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0;font-size:16px;color:var(--muted);text-align:left}
.rows button:last-child{border-bottom:1px solid var(--line)}
.rows button[aria-pressed=true]{color:var(--ink);font-weight:600}
.rows button::after{content:'○';color:var(--muted)}
.rows button[aria-pressed=true]::after{content:'●';color:var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:16px;margin-top:10px}
.swatches button{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:60px;font-size:13px;color:var(--muted)}
.swatches .dot{width:42px;height:42px;border-radius:50%;border:1px solid #d6cfc8}
.swatches button[aria-pressed=true]{color:var(--ink)}
.swatches button[aria-pressed=true] .dot{box-shadow:0 0 0 2px #fff,0 0 0 3px var(--ink)}
.seg{display:flex;border:1px solid var(--line);margin-top:10px}
.seg button{flex:1;min-height:46px;background:none;border:0;border-left:1px solid var(--line);font-size:14px;color:var(--muted)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.namefield{width:100%;min-height:52px;border:0;border-bottom:1px solid var(--ink);padding:0;background:transparent;font-size:30px;border-radius:0}
.namefield:focus{outline:none;border-bottom-color:var(--accent)}
.fonts{display:flex;gap:18px;margin-top:4px}
.fonts button{min-height:44px;background:none;border:0;padding:0;color:var(--muted)}
.fonts button[aria-pressed=true]{color:var(--ink);text-decoration:underline}
.preview{background:var(--cream);display:flex;flex-direction:column;align-items:center;padding:14px 10px;gap:6px}
.preview img,.preview svg{width:min(240px,64vw);aspect-ratio:3/4;object-fit:cover}
.preview .cap{font-size:13px;color:var(--muted);text-align:center}
.primary{width:100%;min-height:56px;background:var(--ink);color:#fff;border:0;font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:15px}
.primary:disabled{opacity:.35}
.ghost{min-height:44px;background:none;border:1px solid var(--ink);padding:0 14px;font-size:13px;letter-spacing:.08em}
.note{font-size:13px;color:var(--muted);line-height:1.6}
.err{color:#9b2c2c;font-size:14px}
/* status */
.bignum{font-family:Simonetta,serif;font-size:88px;line-height:1}
.bar{height:3px;background:var(--line);margin-top:16px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink);transition:width .6s ease}
.bar.live>i{background:repeating-linear-gradient(90deg,var(--ink) 0 18px,var(--rose) 18px 36px);background-size:36px 100%;animation:slide 1s linear infinite}
@keyframes slide{to{background-position:36px 0}}
.timeline div{display:flex;justify-content:space-between;min-height:48px;align-items:center;border-bottom:1px solid var(--line);font-size:15px;color:var(--muted)}
.timeline div.now{color:var(--ink);font-weight:600}
.timeline div.done{color:var(--ink)}
.ready{background:var(--ink);color:#fff;padding:18px;margin:6px 0 18px}
.ready .serif{font-size:32px}
/* board */
.board{padding:16px 20px 30px}
.board .top{max-width:none}
.lanes{display:grid;grid-template-columns:minmax(220px,1fr) repeat(var(--n,3),minmax(220px,1fr));gap:16px;align-items:start}
.lane{border-top:1px solid var(--ink);padding-top:10px;min-width:0}
.lane h2{font-size:22px;display:flex;justify-content:space-between;align-items:baseline}
.lane h2 small{font-family:Raleway,sans-serif;font-size:12px;color:var(--muted)}
.drop{min-height:90px;display:flex;flex-direction:column;gap:8px;padding:8px 0}
.drop.now{background:var(--cream);box-shadow:inset 0 0 0 1px var(--rose);padding:8px;min-height:110px}
.drop.done{min-height:60px}
.drop:empty::before{content:attr(data-empty);font-size:12px;color:var(--muted);padding:10px;text-align:center;border:1px dashed #d8cfc7}
.card{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);padding:8px;touch-action:none;user-select:none;-webkit-user-select:none}
.card .thumb{width:46px;height:62px;flex-shrink:0;background:var(--cream);overflow:hidden}
.card .thumb img,.card .thumb svg{width:100%;height:100%;object-fit:cover}
.card .body{flex:1;min-width:0}
.card .nm{font-family:'Great Vibes',cursive;font-size:26px;line-height:1.05;overflow-wrap:anywhere}
.card .ds{font-size:12px;color:var(--muted)}
.card select{font-size:12px;border:1px solid var(--line);background:#fff;min-height:36px;max-width:110px}
.drop.done .card{opacity:.7;padding:4px 8px}
.drop.done .card .thumb{width:30px;height:40px}
.drop.done .card .nm{font-size:20px}
.sortable-ghost{opacity:.3}
.sortable-chosen{box-shadow:0 8px 24px #0002}
.sync{font-size:12px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.sync i{width:8px;height:8px;border-radius:50%;background:#2e9b5b;display:inline-block}
.sync.off i{background:#c98a2b}
@media (max-width:820px){.lanes{grid-template-columns:1fr}.board{padding:14px}}
/* admin */
.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.field input,.field textarea{border:1px solid var(--line);padding:10px 12px;min-height:46px;border-radius:0;background:#fff;width:100%}
.field textarea{min-height:110px;font:13px/1.5 ui-monospace,Menlo,monospace}
.checks{display:flex;flex-wrap:wrap;gap:14px}
.checks label{display:flex;gap:6px;align-items:center;min-height:44px}
.event{border-top:1px solid var(--line);padding:14px 0;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.event .qr{width:150px;height:150px;background:#fff}
.event .info{flex:1;min-width:200px;display:flex;flex-direction:column;gap:8px}
.links{display:flex;flex-wrap:wrap;gap:10px}
.links a{min-height:44px;display:inline-flex;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;font-size:14px;z-index:9;max-width:90vw}
</style>
</head>
<body>
<div id="app"><div class="wrap"><p class="muted">Loading…</p></div></div>
<script src="preview.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script type="module" src="app.js"></script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
</html>
