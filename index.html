<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ivelisse Orders</title>
<meta name="theme-color" content="#b85c3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ivelisse">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Simonetta:ital@0;1&family=Nunito:wght@400;600;700;800&family=Raleway:wght@500;600&family=Cormorant+Garamond:wght@500&family=Great+Vibes&display=swap">
<style>
/* Ivelisse Board v3 — Steph's site: cream ground, terracotta bands with waves, Simonetta lowercase with italic emphasis, leaf corners. */
:root{
  --cream:#fff8f0; --band:#b85c3a; --ink:#a9532f; --rose:#be836f; --rose-ink:#8a5341;
  --char:#363636; --muted:#665a53; --line:#e7d8cc; --blush:#fbeee5; --ok:#2f6b4a; --warn:#9a5b00;
  --display:Simonetta,Georgia,serif; --body:Nunito,system-ui,sans-serif; --btn:Raleway,system-ui,sans-serif;
  --label:'Cormorant Garamond',Georgia,serif; --script:'Great Vibes',cursive;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --leaf:16px 0;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--char);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
a{color:var(--ink)}
img{max-width:100%;display:block}
em{font-style:italic}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header band with wave */
.band{background:var(--band);color:#fff;text-align:center;padding:calc(12px + var(--safe-t)) 20px 32px;position:relative}
.band .logo{width:92px;margin:0 auto}
.band .ev{font-size:.8125rem;letter-spacing:.1em;text-transform:uppercase}
.band.slim{padding-bottom:28px}
.wave{position:absolute;left:0;bottom:-1px;width:100%;height:24px;display:block}

.page{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.content{flex:1;padding:10px 22px 24px;display:flex;flex-direction:column;gap:18px}
h1{font:400 2.125rem/1.08 var(--display);margin:0;text-align:center;text-wrap:balance}
.rule{width:64%;height:1px;background:var(--rose);margin:0 auto -6px;opacity:.55}
.note{font-size:.9375rem;text-align:center;color:var(--muted);margin:0}
.steps{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;font:400 1.0625rem var(--display);color:var(--muted);margin:4px 0 0;list-style:none;padding:0}
.steps li+li::before{content:'/';margin-right:6px;color:var(--rose)}
.steps .dn{color:var(--rose-ink)}
.steps [aria-current]{color:var(--char);text-decoration:underline;text-decoration-color:var(--ink);text-underline-offset:5px;text-decoration-thickness:2px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font:400 1.3125rem var(--display);color:var(--ink);text-align:center;width:100%;margin-bottom:10px;padding:0}

/* piece cards */
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pcard{background:#fff;border-radius:var(--leaf);overflow:hidden;border:2px solid #fff;position:relative;display:flex;flex-direction:column;align-items:center;padding:0 0 12px;text-align:center}
.pcard[aria-checked=true]{border-color:var(--ink)}
.pcard .ph{width:100%;aspect-ratio:3/4;max-height:200px;background:var(--blush);overflow:hidden}
.pcard .ph img,.pcard .ph svg{width:100%;height:100%;object-fit:cover}
.chip{font:400 .875rem var(--display);text-transform:uppercase;letter-spacing:.03em;background:var(--cream);padding:7px 12px;border-radius:8px;margin-top:-16px;position:relative}
.tick{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:16px}
.mats{text-align:center;font-size:.875rem;color:var(--muted)}

/* options */
.sw{display:flex;justify-content:center;flex-wrap:wrap;gap:14px}
.sw button{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.875rem;min-width:64px}
.sw .dot{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid #d8c6b9}
.sw [aria-checked=true] .dot{box-shadow:0 0 0 3px var(--cream),0 0 0 5px var(--char)}
.sw [aria-checked=true] .dot::after{content:'✓';width:20px;height:20px;border-radius:50%;background:var(--char);color:#fff;display:grid;place-items:center;font-size:12px}
.seg{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.seg button{min-height:48px;flex:1;min-width:88px;border:1px solid var(--rose);border-radius:999px;background:#fff;font-size:.9375rem;padding:0 10px}
.seg [aria-checked=true]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.seg [aria-checked=true]::before{content:'✓ '}
[data-font=script]{font-family:var(--script)!important;font-size:1.375rem!important;font-weight:400!important}
[data-font=serif]{font-family:var(--display)!important}
.lbl{font:500 1.1875rem var(--label);display:block}
.namefield{width:100%;border:0;border-bottom:1.5px solid var(--char);font:400 1.25rem/1.4 var(--body);padding:8px 0;background:transparent;border-radius:0}
.namefield:focus{outline:none;border-bottom-color:var(--ink);border-bottom-width:2px}
.count{font-size:.8125rem;color:var(--muted);text-align:right;margin-top:4px}
.mini{background:#fff;border-radius:18px 0;display:grid;grid-template-columns:80px minmax(0,1fr);gap:12px;align-items:center;padding:8px}
.mini .ph{width:80px;height:106px;border-radius:12px 0;overflow:hidden;background:var(--blush)}
.mini .ph img,.mini .ph svg{width:100%;height:100%;object-fit:cover}
.mini .k{font:400 .9375rem var(--display);color:var(--rose-ink)}
.mini .nm{font:800 1.125rem var(--body);overflow-wrap:anywhere}
.mini .ds{font-size:.875rem;color:var(--muted)}
.proof{background:#fff;border-radius:24px 0;padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.proof .ph{width:min(200px,60vw);aspect-ratio:3/4;border-radius:16px 0;overflow:hidden;background:var(--blush)}
.proof .ph img,.proof .ph svg{width:100%;height:100%;object-fit:cover}
.rows{width:100%;border-top:1px solid var(--line);margin:0}
.rows div{display:flex;justify-content:space-between;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:.9375rem}
.rows dt{color:var(--muted)} .rows dd{margin:0;text-align:right}
.spell{width:100%;display:flex;align-items:center;gap:12px;padding-top:10px;font-size:1rem}
.editbtn{min-height:48px;padding:0 20px;border:1.5px solid var(--ink);border-radius:12px 0;background:#fff;color:var(--ink);font:800 1rem var(--body)}
.linkbtn{background:none;border:0;color:var(--ink);font-weight:700;text-decoration:underline;min-height:44px;padding:0}

/* sticky action bar */
.bar{position:sticky;bottom:0;padding:12px 22px calc(14px + var(--safe-b));background:var(--cream);border-top:1px solid var(--line);display:flex;gap:10px;z-index:3}
.btn{min-height:54px;flex:1;border-radius:var(--leaf);border:0;display:flex;align-items:center;justify-content:center;font:600 1rem var(--btn);letter-spacing:.02em;background:var(--ink);color:#fff;text-decoration:none;padding:0 14px}
.btn:disabled{opacity:.4}
.btn.sec{flex:0 0 92px;background:transparent;color:var(--char);border:1px solid var(--rose)}
.btn.out{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.err{color:#9b2c2c;font-size:.9375rem;text-align:center;margin:0}

/* status */
.state{text-align:center}
.eyebrow{font:400 1.0625rem var(--display);color:var(--rose-ink)}
.big{font:800 4rem/1 var(--body);color:var(--ink)}
.miles{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));font-size:.8125rem;color:var(--muted);position:relative;text-align:center}
.miles::before{content:'';position:absolute;left:16.6%;right:16.6%;top:10px;height:2px;background:var(--line)}
.miles li{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.miles b{width:22px;height:22px;border-radius:50%;background:var(--cream);border:2px solid var(--line)}
.miles .dn b{background:var(--rose);border-color:var(--rose)}
.miles [aria-current]{color:var(--char);font-weight:800}
.miles [aria-current] b{background:var(--ink);border-color:var(--ink);box-shadow:0 0 0 5px rgba(169,83,47,.18);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(169,83,47,.08)}}
.live{font-size:.8125rem;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.live.off i{background:var(--warn)}
.save{display:flex;gap:8px;align-items:center;justify-content:space-between;background:#fff;border-radius:14px 0;padding:6px 12px;font-size:.875rem}
.save span{color:var(--muted)}
.readyband{background:var(--ink);padding-bottom:38px}
.readyband h1{color:#fff;font-size:2.625rem}
.code{display:inline-block;margin-top:12px;background:#fff;color:var(--char);font:800 1.75rem/1 var(--body);letter-spacing:.14em;padding:10px 16px;border-radius:14px 0;font-variant-numeric:tabular-nums}
.mine{background:#fff;border-radius:14px 0;padding:10px 12px}
.mine a{display:flex;justify-content:space-between;min-height:44px;align-items:center;text-decoration:none;color:var(--char);border-top:1px solid var(--line)}
.mine a:first-of-type{border-top:0}
.mine b{color:var(--ink)}

/* board */
.boardpage{min-height:100dvh;display:flex;flex-direction:column}
.bh{background:var(--band);color:#fff;display:flex;align-items:center;flex-wrap:wrap;gap:10px 22px;padding:calc(8px + var(--safe-t)) 24px 28px;position:relative}
.bh .logo{width:84px}
.bh .t{font:400 1.375rem var(--display)}
.bh .sub{font-size:.8125rem;letter-spacing:.08em;text-transform:uppercase}
.bh .k{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.9375rem;align-items:center}
.bh .k b{font:800 1.375rem var(--body);margin-right:4px;font-variant-numeric:tabular-nums}
.bh .pu{background:#fff;color:var(--ink);border:0;border-radius:12px 0;padding:0 14px;min-height:44px;font-weight:800}
.bh .lv{font-size:.8125rem;display:flex;gap:6px;align-items:center}
.bh .lv i{width:9px;height:9px;border-radius:50%;background:#bff0d0}
.bh .lv.off i{background:#ffd27a}
.bh a{color:#fff}
/* portrait: columns stack (two across on a portrait iPad); landscape: kanban, one column per lane */
.lanes{flex:1;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding:8px 16px 24px;align-items:start}
@media (orientation:portrait) and (min-width:700px){.lanes{grid-template-columns:repeat(2,minmax(0,1fr));padding:8px 18px 24px}.lanes>.lane.q,.lanes>.lane.ready{grid-column:1/-1}}
@media (orientation:landscape) and (min-width:700px){
  .boardpage{height:100dvh;overflow:hidden}
  .bh{flex:none;padding-bottom:26px}
  .lanes{display:flex;align-items:stretch;gap:10px;padding:6px 12px calc(12px + var(--safe-b));min-height:0;overflow:hidden}
  .lane{flex:1 1 0;min-width:0;background:rgba(255,255,255,.5);border-radius:var(--leaf);padding:8px 8px 10px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .lane.q{flex-grow:1.5}
  .lane h2{font-size:1.375rem;position:sticky;top:-8px;background:#fffaf4;z-index:1;padding:4px 0}
  .lane{background:#fffaf4}
  .lane .drop{flex:1;min-height:140px}
  .lane .qc .ph{width:40px;height:54px}.qc{grid-template-columns:40px minmax(0,1fr)}
}
.lane{display:flex;flex-direction:column;gap:8px;min-width:0}
.lane h2{font:400 1.625rem var(--display);margin:0;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.lane h2 small{font:600 .8125rem var(--body);color:var(--muted)}
.drop{display:flex;flex-direction:column;gap:8px;min-height:60px}
.qc{background:#fff;border-radius:14px 0;padding:8px;display:grid;grid-template-columns:46px minmax(0,1fr);gap:4px 10px;touch-action:none;user-select:none;-webkit-user-select:none}
.qc .ph{width:46px;height:62px;border-radius:8px 0;overflow:hidden;grid-row:span 2;background:var(--blush)}
.qc .ph img,.qc .ph svg{width:100%;height:100%;object-fit:cover}
.qc .nm{font:800 1.1875rem/1.15 var(--body);overflow-wrap:anywhere;display:flex;gap:8px;align-items:center}
.pos{flex-shrink:0;min-width:26px;height:26px;border-radius:50%;background:var(--char);color:#fff;font:800 .8125rem/26px var(--body);text-align:center;font-variant-numeric:tabular-nums}
.qc .ds{font-size:.8125rem;color:var(--muted);line-height:1.35}
.qc .ft{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:6px;margin-top:2px;flex-wrap:wrap}
.age{font:700 .8125rem var(--body);background:var(--blush);padding:4px 9px;border-radius:999px;white-space:nowrap}
.age.hot{background:#f6d5c6;color:#7a2f12}
.go{min-height:44px;padding:0 14px;border-radius:12px 0;border:0;background:var(--ink);color:#fff;font:700 .875rem var(--body)}
.go:disabled{background:#d9cbc1;color:var(--muted)}
.who{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.who button{min-height:44px;padding:0 14px;border-radius:12px 0;border:1.5px solid var(--ink);background:#fff;color:var(--ink);font-weight:800}
/* queue card assign buttons: 1 = full width, 2 = left/right, 3 = thirds */
.assign{grid-column:1/-1;display:grid;gap:8px}
.assign.n1{grid-template-columns:minmax(0,1fr)}.assign.n2{grid-template-columns:repeat(2,minmax(0,1fr))}.assign.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.as{min-height:48px;border-radius:12px 0;border:1.5px solid var(--ink);background:#fff;color:var(--ink);font:800 .9375rem var(--body);padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.as.me{background:var(--ink);color:#fff}
.assign.n3 .as{font-size:.8125rem;padding:0 3px;white-space:normal;overflow-wrap:anywhere;line-height:1.1}
.acts2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ret{min-height:48px;border-radius:12px 0;border:1.5px solid var(--rose);background:#fff;color:var(--char);font:700 .875rem var(--body)}
.rc{background:#fff;border-radius:14px 0;padding:8px;display:grid;grid-template-columns:40px minmax(0,1fr);gap:6px 10px;align-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
.rc .ph{width:40px;height:54px;border-radius:8px 0;overflow:hidden;background:var(--blush)}
.rc .ph img,.rc .ph svg{width:100%;height:100%;object-fit:cover}
.rc .nm{font:800 1.0625rem var(--body);overflow-wrap:anywhere}
.rc .cd{font:800 .8125rem var(--body);letter-spacing:.1em;color:var(--muted);margin-left:4px}
.rc .ds{font-size:.8125rem;color:var(--muted)}
.pk2{grid-column:1/-1;min-height:44px;border-radius:12px 0;border:1.5px solid var(--ok);background:#fff;color:var(--ok);font:800 .875rem var(--body)}
.lane.mine h2{color:var(--ink)}
.you{vertical-align:middle;margin-left:4px;background:var(--ink);color:#fff!important;padding:2px 8px;border-radius:999px;font-size:.6875rem!important}
.lane.ready h2{color:var(--ok)}
.bh .whoami{font-size:.875rem}
.pend{grid-column:1/-1;font-size:.75rem;font-weight:800;color:var(--warn)}
.now{background:#fff;border:2px solid var(--ink);border-radius:var(--leaf);padding:10px;display:flex;flex-direction:column;gap:8px;touch-action:none;user-select:none;-webkit-user-select:none}
.now .top{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:center}
.now .ph{width:64px;height:86px;border-radius:10px 0;overflow:hidden;background:var(--blush)}
.now .ph img,.now .ph svg{width:100%;height:100%;object-fit:cover}
.now .nm{font:800 1.375rem/1.1 var(--body);overflow-wrap:anywhere}
.now .ds{font-size:.8125rem;color:var(--muted);line-height:1.35}
.rd{min-height:48px;border-radius:12px 0;border:0;background:var(--ok);color:#fff;font:800 .9375rem var(--body)}
.free{border:2px dashed var(--rose);border-radius:var(--leaf);min-height:120px;display:grid;place-items:center;font-size:.875rem;color:var(--muted);text-align:center;padding:10px}
.free b{font:400 1.25rem var(--display);color:var(--char);display:block}
.drop.zone:has(.now) .free{display:none}
details.eng{border-top:1px solid var(--line);padding-top:6px;font-size:.875rem;color:var(--muted)}
details.eng summary{min-height:44px;display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;font-weight:700;color:var(--ink)}
details.eng summary::-webkit-details-marker{display:none}
details.eng summary::before{content:'';width:0;height:0;border-left:7px solid var(--ink);border-top:5px solid transparent;border-bottom:5px solid transparent;transition:transform .15s}
details.eng[open] summary::before{transform:rotate(90deg)}
details.eng li{padding:4px 0;color:var(--char)}
details.eng ul{list-style:none;padding:0;margin:0}
.sortable-ghost{opacity:.35}
.sortable-chosen{box-shadow:0 10px 26px rgba(54,54,54,.2)}
dialog.pickup{border:0;padding:0;margin:0 0 0 auto;height:100dvh;max-height:100dvh;width:min(440px,100vw);background:var(--cream);color:var(--char)}
dialog.pickup::backdrop{background:rgba(54,54,54,.3)}
.pk-in{height:100%;display:flex;flex-direction:column;gap:12px;padding:calc(20px + var(--safe-t)) 20px calc(20px + var(--safe-b))}
.pk-in h2{font:400 1.75rem var(--display);margin:0;display:flex;justify-content:space-between;align-items:center}
.close{min-width:48px;min-height:48px;border:1px solid var(--rose);border-radius:12px 0;background:#fff;font-size:1.25rem}
.find{border:1.5px solid var(--char);border-radius:12px 0;min-height:52px;padding:0 14px;font:700 1.375rem var(--body);letter-spacing:.14em;text-transform:uppercase;background:#fff;width:100%}
.pk-list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px}
.pr{background:#fff;border-radius:14px 0;padding:10px;display:grid;grid-template-columns:auto 44px minmax(0,1fr) auto;gap:10px;align-items:center}
.pr .c{font:800 1.25rem var(--body);letter-spacing:.1em;font-variant-numeric:tabular-nums}
.pr .ph{width:44px;height:58px;border-radius:8px 0;overflow:hidden;background:var(--blush)}
.pr .ph img,.pr .ph svg{width:100%;height:100%;object-fit:cover}
.pr .pk{min-height:48px;padding:0 14px;border-radius:12px 0;border:1.5px solid var(--ok);background:#fff;color:var(--ok);font:800 .875rem var(--body)}
.pr.match{outline:3px solid var(--ink)}
@media (max-width:820px){.bh{padding-left:16px;padding-right:16px}.bh .k{margin-left:0}}
/* phones: a finger on a card scrolls the page; press and hold a card to drag it */
@media (max-width:820px){.qc,.now,.rc{touch-action:pan-y}}

/* event staff sign in */
.namegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.namegrid button{min-height:64px;border-radius:var(--leaf);border:1.5px solid var(--ink);background:#fff;color:var(--ink);font:800 1.125rem var(--body);overflow-wrap:anywhere;padding:0 8px}
.namegrid [aria-checked=true]{background:var(--ink);color:#fff}
.pinfield{border:1.5px solid var(--char);background:#fff;min-height:60px;font:800 1.75rem var(--body);letter-spacing:.5em;text-align:center;padding:0 0 0 .5em;width:100%;max-width:220px;margin:0 auto;border-radius:12px 0}
.pinrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.pinrow .btn{flex:0 0 auto;min-width:130px}
.pinshow{font:800 2rem/1.2 var(--body);letter-spacing:.3em;font-variant-numeric:tabular-nums}
.snav .tostaff{color:var(--char)}

/* optional text opt-in */
.optin{display:flex;flex-direction:column;gap:6px}
.optin .lbl span{font:600 .8125rem var(--body);color:var(--muted);margin-left:4px}
.phonefield{border:1px solid #d8c6b8;background:#fff;min-height:52px;padding:0 14px;font:700 1.125rem var(--body);width:100%;border-radius:0}
.fine{font-size:.75rem;line-height:1.4;color:var(--muted);margin:0}
.txt{color:var(--ok);font-weight:800}

/* admin */
.wrap{max-width:860px;margin:0 auto;padding:16px 22px 40px}
.wrap h1{text-align:left;margin-top:8px}
.snav{display:flex;flex-wrap:wrap;gap:0 18px;align-items:center;max-width:860px;margin:0 auto;padding:4px 22px 0}
.snav a{min-height:44px;display:inline-flex;align-items:center;font-weight:800;text-decoration:none}
.snav span{margin-left:auto;color:var(--muted);font-size:.8125rem;overflow-wrap:anywhere}
.sec{font:400 1.375rem var(--display);color:var(--ink);margin:26px 0 8px}
.hint{font-size:.875rem;color:var(--muted);margin:2px 0 6px}
.card{background:#fff;border-radius:var(--leaf);padding:16px 18px;margin:14px 0}
.card h2{font:400 1.375rem var(--display);margin:0 0 4px;color:var(--ink)}
.card .field input{border-color:#d8c6b8}
.newev{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;gap:4px 12px;align-items:end}
.newev h2{grid-column:1/-1}.newev .field{margin:6px 0 0}.newev .btn{flex:none;padding:0 20px}
@media (max-width:640px){.newev{grid-template-columns:1fr}}
.evlist{display:flex;flex-direction:column;gap:8px}
.evcard{background:#fff;border-radius:14px 0;padding:12px 14px;display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--char);min-height:64px}
.evcard>div{flex:1;min-width:0;display:flex;flex-direction:column}
.evcard b{font:800 1.0625rem var(--body);overflow-wrap:anywhere}
.evcard>div span{font-size:.8125rem;color:var(--muted)}
.chip{font:700 .75rem var(--body);padding:4px 10px;border-radius:999px;background:var(--line);color:var(--muted);white-space:nowrap}
.chip.on{background:#dcefe3;color:var(--ok)}
.chev{font-size:1.5rem;color:var(--ink)}
.pastev{margin-top:12px}.pastev summary{min-height:44px;display:flex;align-items:center;font-weight:800;color:var(--ink);cursor:pointer}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}.btnrow .btn{flex:1 1 170px}
.tog{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;min-height:44px;font-weight:800;margin-top:6px}
.tog input{width:22px;height:22px;accent-color:var(--ink)}.tog small{grid-column:2;font-weight:400;color:var(--muted);font-size:.8125rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chips span{display:inline-flex;align-items:center;background:var(--blush);border-radius:999px;padding:0 2px 0 14px;min-height:40px;font-weight:700}
.chips button{border:0;background:none;min-width:40px;min-height:40px;font-size:1.25rem;color:var(--rose-ink)}
.addrow{display:flex;gap:8px}.addrow input{flex:1;min-width:0;border:1px solid #d8c6b8;padding:10px 12px;min-height:48px;background:#fff}.addrow .btn{flex:0 0 96px;min-height:48px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
.itile{border:2px solid var(--line);border-radius:14px 0;padding:8px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.itile:has(input:checked){border-color:var(--ink)}
.itile .ph{aspect-ratio:3/4;overflow:hidden;border-radius:10px 0;background:var(--blush)}
.itile .ph img,.itile .ph svg{width:100%;height:100%;object-fit:cover}
.itile>span:last-child{display:flex;gap:8px;align-items:center;font-weight:800;min-height:36px}
.itile input{width:20px;height:20px;accent-color:var(--ink)}
.share{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.share .qr{width:150px;height:150px;background:#fff;border:1px solid var(--line);padding:4px;flex:none}
.shareinfo{flex:1;min-width:220px;display:flex;flex-direction:column;gap:10px}
.share .url{font-size:.8125rem;color:var(--muted);overflow-wrap:anywhere}
.snav a[aria-current=page]{color:var(--char);text-decoration:underline;text-decoration-color:var(--ink);text-decoration-thickness:2px;text-underline-offset:6px}
.field select,.addrow select{border:1px solid #d8c6b8;padding:0 12px;min-height:48px;background:#fff;width:100%;border-radius:0}
.newev .wide{grid-column:1/-1}
.backlink{display:inline-flex;align-items:center;min-height:44px;font-weight:800;text-decoration:none}
.sec small{font:600 .8125rem var(--body);color:var(--muted);margin-left:6px}
.cathead{font:400 1.25rem var(--display);margin:16px 0 6px;color:var(--char)}
.prow{border:2px solid var(--line);border-radius:14px 0;padding:8px 10px;margin:8px 0;display:flex;flex-direction:column;gap:8px}
.prow.on{border-color:var(--ink)}
.ptop{display:flex;gap:12px;align-items:center;cursor:pointer;min-height:56px}
.ptop .ph,.pedit summary .ph{width:44px;height:58px;flex:none;border-radius:8px 0;overflow:hidden;background:var(--blush)}
.ptop .ph img,.ptop .ph svg,.pedit summary .ph svg{width:100%;height:100%;object-fit:cover}
.pn{display:flex;flex-direction:column;min-width:0}.pn>span{display:flex;gap:8px;align-items:center}
.pn input{width:22px;height:22px;accent-color:var(--ink)}.pn small{color:var(--muted);font-size:.8125rem}
.cgrp{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding-left:2px}
.gl{font:700 .8125rem var(--body);color:var(--muted);min-width:64px}
.cchips{display:flex;flex-wrap:wrap;gap:6px}
.cc{min-height:40px;padding:0 12px;border-radius:999px;border:1.5px solid var(--ink);background:var(--ink);color:#fff;font:700 .8125rem var(--body);display:inline-flex;align-items:center;gap:6px}
.cc i{width:14px;height:14px;border-radius:50%;border:1px solid #fff8}
.cc[aria-pressed=false]{background:#fff;color:var(--muted);border-color:var(--line);text-decoration:line-through}
.catsec{margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
.cathdr{display:flex;gap:8px;align-items:center}
.catname{flex:1;min-width:0;font:400 1.5rem var(--display);border:0;border-bottom:1px dashed var(--rose);background:transparent;padding:6px 2px;color:var(--ink)}
.tools{display:inline-flex;gap:4px;flex:none}
.tools button{min-width:40px;min-height:40px;border:1px solid var(--line);background:#fff;border-radius:10px 0;color:var(--char);font-size:1rem}
.tools button:disabled{opacity:.35}
.pedit{background:#fff;border-radius:14px 0;margin:10px 0}
.pedit summary{display:flex;gap:12px;align-items:center;padding:8px 10px;cursor:pointer;list-style:none;min-height:64px}
.pedit summary::-webkit-details-marker{display:none}
.pedit summary .pn{flex:1}.pedit summary b{font:800 1.0625rem var(--body)}
.pbody{padding:0 14px 14px;border-top:1px solid var(--line)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.gtitle{font:800 .9375rem var(--body);margin:16px 0 6px}
.gedit{border:1px solid var(--line);border-radius:12px 0;padding:10px;margin:8px 0;display:flex;flex-direction:column;gap:8px;background:var(--cream)}
.ghead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gname{flex:1 1 160px;min-height:44px;border:1px solid #d8c6b8;padding:0 10px;font-weight:800;background:#fff}
.sw-tog{display:flex;gap:6px;align-items:center;font-size:.8125rem;min-height:44px}
.chlist{display:flex;flex-wrap:wrap;gap:6px}
.chi{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 2px 2px 8px}
.chi input:not([type=color]){border:0;min-height:36px;width:9.5em;background:transparent;font-weight:700}
.chi input[type=color]{width:28px;height:28px;border:0;padding:0;background:none}
.chi button{border:0;background:none;min-width:36px;min-height:36px;color:var(--rose-ink);font-size:1.125rem}
.addg,.addp{margin-top:8px;width:100%}
.savebar{position:sticky;bottom:0;background:var(--cream);border-top:1px solid var(--line);padding:10px 22px calc(12px + var(--safe-b));display:flex;gap:12px;align-items:center;z-index:5}
.savebar span{color:var(--muted);font-size:.875rem;margin-right:auto}
.savebar .btn{flex:0 0 auto;min-width:150px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ptile{background:#fff;border-radius:14px 0;padding:8px;display:flex;flex-direction:column;gap:6px;margin:0}
.ptile .pimg{aspect-ratio:3/4;border-radius:10px 0;overflow:hidden;background:var(--blush);position:relative}
.ptile .pimg img,.ptile .pimg svg{width:100%;height:100%;object-fit:cover}
.ptile .pimg.none svg{opacity:.4}
.ptile .tag{position:absolute;left:6px;bottom:6px;background:rgba(255,255,255,.92);font:700 .6875rem var(--body);padding:3px 8px;border-radius:999px}
.ptile figcaption{font-weight:700;font-size:.875rem}
.ptile .acts{display:flex;gap:6px}
.up{flex:1;position:relative;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px 0;background:var(--ink);color:#fff;font:700 .875rem var(--body);cursor:pointer}
.up.busy{opacity:.6}.up input{position:absolute;inset:0;opacity:0;cursor:pointer}
.up:focus-within{outline:3px solid var(--char);outline-offset:2px}
.rm{min-height:44px;min-width:44px;border:1px solid var(--line);background:#fff;border-radius:12px 0;color:var(--rose-ink);font-size:1.25rem}
.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.field input,.field textarea{border:1px solid var(--line);padding:10px 12px;min-height:46px;border-radius:0;background:#fff;width:100%}
.field textarea{min-height:110px;font:13px/1.5 ui-monospace,Menlo,monospace}
.checks{display:flex;flex-wrap:wrap;gap:14px}
.checks label{display:flex;gap:6px;align-items:center;min-height:44px}
.event{border-top:1px solid var(--line);padding:14px 0;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.event .qr{width:150px;height:150px;background:#fff;padding:6px}
.event .info{flex:1;min-width:220px;display:flex;flex-direction:column;gap:8px}
.event h2{font:400 1.5rem var(--display);margin:0}
.links{display:flex;flex-wrap:wrap;gap:4px 14px}
.links a{min-height:44px;display:inline-flex;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--safe-b));transform:translateX(-50%);background:var(--char);color:#fff;padding:10px 16px;font-size:.875rem;z-index:20;max-width:90vw;display:flex;gap:14px;align-items:center;border-radius:12px 0}
.toast button{background:none;border:1px solid #fff;color:#fff;min-height:36px;padding:0 10px;border-radius:8px 0;font-weight:800}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* staff sign in: Events link pinned under the button */
.bar.stack{flex-direction:column;align-items:stretch;gap:4px}
.barlink{align-self:center;min-height:40px;display:inline-flex;align-items:center;font-weight:800;font-size:.875rem;color:var(--muted);text-decoration:none}
.evnow{text-align:center}.evnow h1{margin-top:2px}
/* Events page */
.toprow{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin:6px 0 4px}.toprow .card{margin:0}
.pinedit{display:flex;gap:10px;align-items:center;margin:8px 0}.pinedit .pinfield{margin:0;max-width:170px}.pinedit .btn{flex:0 0 110px}
.toprow .share .qr{width:120px;height:120px}.toprow .shareinfo{min-width:150px;gap:8px}
.chip.live{background:var(--ink);color:#fff}
.evcard.islive{outline:2px solid var(--ink)}
details.newev{margin-top:12px}details.newev>summary{font-weight:800;color:var(--ink);cursor:pointer;min-height:44px;display:flex;align-items:center;list-style:none}
details.newev>summary::-webkit-details-marker{display:none}
/* event page: numbered steps */
.evhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.evhead h1{margin:8px 0}
.copyrow{margin:12px 0 4px}.copyrow .lbl{margin-bottom:4px}
.card.step h2{display:flex;align-items:center;gap:10px}
.card.step h2 .n{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font:800 .875rem var(--body);display:grid;place-items:center;flex:none}
.h2link{margin-left:auto;font:800 .875rem var(--body);text-decoration:none}
.card.step.fixed{opacity:.75}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 14px}
.openseg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.openseg button{border:1.5px solid var(--line);background:#fff;border-radius:14px 0;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:72px;color:var(--char)}
.openseg b{font:800 1.0625rem var(--body)}.openseg small{color:var(--muted);font-size:.8125rem}
.openseg [aria-checked=true]{border-color:var(--ink);background:var(--ink);color:#fff}.openseg [aria-checked=true] small{color:#fff}
/* branding */
.brandgrid{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:18px;align-items:start}
@media (max-width:640px){.brandgrid{grid-template-columns:1fr}}
.bslot{display:grid;grid-template-columns:110px 72px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.bthumb{width:72px;height:48px;border:1px dashed var(--line);display:grid;place-items:center;background:var(--cream);font-size:.75rem;color:var(--muted)}
.bthumb img{max-width:100%;max-height:100%;object-fit:contain}
.bup{min-height:40px;cursor:pointer}
.phonebox{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:var(--cream);box-shadow:0 6px 20px #0001}
.pb-band{background:var(--band);color:#fff;text-align:center;padding:12px 10px 16px;position:relative}
.pb-band .logo{width:64px;margin:0 auto}.pb-band .ev{font-size:.625rem;letter-spacing:.1em;text-transform:uppercase}
.pb-body{padding:14px;text-align:center}
.pb-big{font:400 3rem/1 var(--display);color:var(--ink)}
.pb-line{height:10px;background:var(--line);border-radius:5px;margin:10px auto;width:80%}.pb-line.short{width:50%}
.band .bcorner,.pb-band .bcorner{position:absolute;top:calc(10px + var(--safe-t));max-width:76px;max-height:44px;object-fit:contain}
.pb-band .bcorner{top:8px;max-width:48px;max-height:30px}
.bcorner.tl{left:12px}.bcorner.tr{right:12px}
.bbottom{display:flex;justify-content:center;margin:22px auto 6px}.bbottom img{max-width:min(220px,60%);max-height:110px;object-fit:contain}
.pb-body .bbottom img{max-width:60%;max-height:60px}
/* form builder */
.builder{max-width:1180px}
.gf .pb-body{text-align:left}.gf fieldset{margin:0 0 14px}.gf legend{font-size:1.125rem}
.gf .pick{gap:8px}.gf .pcard .ph{max-height:120px}.gf .seg button{min-height:38px;min-width:64px;font-size:.8125rem}
.gf .sw{gap:10px}.gf .sw .dot{width:34px;height:34px}.gf .sw button{min-width:48px;font-size:.75rem}
.pb-div{text-align:center;font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:4px 0 10px;border-top:1px solid var(--line);padding-top:8px}
.pb-name{border:1px solid #d8c6b8;background:#fff;min-height:42px;display:flex;align-items:center;justify-content:center;color:var(--muted);margin-bottom:8px;font-size:.875rem}
.gtitle{font:400 1.25rem var(--display);margin:14px 0 4px;color:var(--char)}

/* form builder: top-down branching tree */
.bhead{display:flex;align-items:center;gap:12px}.bhead h1{margin:4px auto 8px 0}.bhead .btn{flex:0 0 auto;min-width:120px}
.builder{max-width:860px}
.tree{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.tkids{display:flex;flex-direction:column;gap:6px;margin-left:20px;padding-left:16px;border-left:2px solid var(--rose);position:relative}
.tkids>.trow::before,.tkids>.tadd::before,.tkids>.tdetails::before{content:'';position:absolute;left:-18px;top:26px;width:16px;border-top:2px solid var(--rose)}
.trow,.tadd,.tdetails{position:relative}
.trow{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:12px 0;padding:6px 8px;min-height:52px;min-width:0}
.trow.open{border-color:var(--ink)}
.trow.category{background:var(--ink);border-color:var(--ink)}.trow.category .tname,.trow.category .tmeta,.trow.category .ttag,.trow.category .tog{color:#fff}
.trow.category .tname:focus{background:#ffffff22}
.tog{width:32px;height:36px;flex:none;border:0;background:none;font-size:1.125rem;color:var(--ink);padding:0}.tog.none{display:inline-block}
.ttag{font:800 .625rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);flex:none;width:64px}
.tname{flex:1;min-width:0;border:0;background:transparent;font:700 1rem var(--body);color:var(--char);padding:6px 4px;min-height:36px;border-radius:6px}
.tname:focus{outline:2px solid var(--rose);background:var(--cream)}
.tmeta{font-size:.75rem;color:var(--muted);white-space:nowrap;flex:none}
.ttools{display:none;gap:2px;flex:none}.trow:hover .ttools,.trow:focus-within .ttools{display:flex}
.ttools button{min-width:32px;min-height:34px;border:1px solid var(--line);background:#fff;border-radius:6px;color:var(--char)}.ttools button:disabled{opacity:.3}
.tphoto{width:36px;height:48px;flex:none;border-radius:6px 0;overflow:hidden;background:var(--blush);border:0;padding:0;display:grid;place-items:center;font-size:.5625rem;font-weight:800;color:var(--ink);line-height:1.1}
.tphoto img,.tphoto svg{width:100%;height:100%;object-fit:cover}.tphoto.off{opacity:.6}
.trow .dot{width:22px;height:22px;border-radius:50%;border:1px solid #d8c6b9;display:block;flex:none}
.trow input[type=color]{width:30px;height:30px;border:0;padding:0;background:none;flex:none}
.tcolors{display:flex;gap:4px;align-items:center;font-size:.75rem;color:var(--muted);flex:none}
.trow.fixed{background:var(--cream);border-style:dashed}.trow.fixed .tname{color:var(--muted)}
.tdetails{display:flex;flex-wrap:wrap;gap:8px 12px;background:var(--cream);border:1px dashed var(--line);border-radius:10px 0;padding:8px 10px}
.tdetails label{display:flex;flex-direction:column;gap:2px;font-size:.75rem;color:var(--muted);flex:1 1 140px;min-width:0}
.tdetails input,.tdetails select{width:100%;min-width:0;max-width:100%;border:1px solid #d8c6b8;background:#fff;min-height:40px;padding:0 8px;font:600 .9375rem var(--body);color:var(--char);border-radius:0}
.tadd{min-height:44px;border:1.5px dashed var(--rose);border-radius:12px 0;background:transparent;color:var(--ink);font-weight:800;text-align:left;padding:0 12px}
.tadd.in{display:flex;align-items:center;padding:0 8px}.tadd.in input{border:0;background:transparent;font-weight:700;min-height:40px;width:100%}
@media (max-width:640px){.ttag{display:none}.tkids{margin-left:10px;padding-left:12px}.tkids>.trow::before,.tkids>.tadd::before,.tkids>.tdetails::before{left:-14px;width:12px}.tcolors{font-size:0;gap:0}}
.savebar>a.btn{flex:0 0 auto;min-width:96px}
.shead{display:flex;align-items:center;gap:8px}.shead h3{flex:1;margin:0}
.sx{width:40px;height:40px;border:0;background:none;font-size:1.5rem;color:var(--char);flex:none}
.psheet{border:0;border-radius:18px;padding:18px;width:min(420px,92vw);background:var(--cream);display:flex;flex-direction:column;gap:10px}
.psheet:not([open]){display:none}
.psheet h3{font:400 1.375rem var(--display);margin:0 0 4px;text-align:center}
.psheet .btn{width:100%;cursor:pointer}
.psheet .linkbtn{align-self:center}.linkbtn.danger{color:#a33}
.libgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:60vh;overflow:auto}
.libgrid button{border:0;padding:0;overflow:hidden;border-radius:8px 0;background:var(--blush);display:flex;flex-direction:column}.libgrid img{width:100%;aspect-ratio:3/4;object-fit:cover}.libgrid span{font-size:.5625rem;color:var(--muted);background:#fff;padding:3px 2px;line-height:1.2}
.gvsheet{width:min(380px,94vw);max-height:92vh;overflow:auto}
/* two open events */
.evpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.evpick button,.evpick a{min-height:72px;border-radius:var(--leaf);border:1.5px solid var(--ink);background:#fff;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;padding:8px}
.evpick b{font:800 1.0625rem var(--body);text-align:center}.evpick small{font-size:.8125rem;color:var(--muted)}
.evpick [aria-checked=true]{background:var(--ink);color:#fff}.evpick [aria-checked=true] small{color:#fff}
.card.reuse{display:flex;flex-direction:column;gap:8px}

/* breadcrumbs */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;font-size:.875rem;margin:4px 0 10px}
.crumbs a{font-weight:800;text-decoration:none;min-height:36px;display:inline-flex;align-items:center}
.crumbs span{color:var(--muted);font-weight:700}.crumbs i{color:var(--rose);font-style:normal}
.shead2{max-width:860px;margin:0 auto;padding:6px 22px 0}.shead2 .snav{padding:0;max-width:none}
.builder~.savebar,.shead2+.builder{}
.evpick.tall{grid-template-columns:1fr;gap:12px;margin-top:8px}.evpick.tall a{min-height:96px}.evpick.tall b{font-size:1.375rem}
.namegrid [aria-current=true]{background:var(--ink);color:#fff}
.eventqr{display:flex;gap:14px;align-items:center;background:#fff;border-radius:var(--leaf);padding:12px;margin-top:22px}
.eventqr .qr{width:120px;height:120px;flex:none}.eventqr b{display:block;font:800 1.0625rem var(--body)}.eventqr span{font-size:.875rem;color:var(--muted)}

/* menu tree in the event page */
.tarrow{width:32px;height:36px;flex:none;border:0;background:none;font-size:1.125rem;color:var(--ink);padding:0;display:inline-block}
.trow.category .tarrow{color:#fff}
.trow[data-row]{cursor:pointer}
.trow.off{background:#faf3ec}.trow.off .tname{color:var(--muted);text-decoration:line-through}
.sw2{position:relative;width:48px;height:28px;flex:none;display:block}
.sw2 input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.sw2 i{position:absolute;inset:0;border-radius:999px;background:#d8c6b8;transition:background .15s}
.sw2 i::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.sw2 input:checked+i{background:var(--ok)}.sw2 input:checked+i::after{left:23px}
.sw2 input:focus-visible+i{outline:2px solid var(--ink);outline-offset:2px}
.tpwrap{position:relative;flex:none;display:block}
label.tphoto{position:relative;cursor:pointer}
.tphoto input,.vhfile{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.bup{position:relative}
.tprm{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:0;background:var(--char);color:#fff;font-size:13px;line-height:1;padding:0}
.btnrow.three .btn{flex:1 1 150px}
#reuseform{margin-top:10px}
/* breadcrumbs: clearly tappable */
.crumbs{position:relative;z-index:3;font-size:1rem}
.crumbs a{text-decoration:underline;text-underline-offset:4px;min-height:44px;padding:0 4px}
.crumbs span{padding:0 4px}

/* event list cards: setup link, Client's POV, status */
.evmain{flex:1;min-width:0;display:flex;flex-direction:column;text-decoration:none;color:var(--char);align-self:stretch;justify-content:center}
.evmain span{font-size:.8125rem;color:var(--muted)}
.evtail{display:flex;align-items:center;gap:10px;text-decoration:none;align-self:stretch}
.evcard .pov{flex:0 0 auto;min-height:40px;padding:0 14px;font-size:.875rem;width:auto}
.savebar #pov{min-width:0;padding:0 16px}
@media (max-width:560px){.savebar #dirty{display:none}.savebar .btn{flex:1 1 0;min-width:0;font-size:.875rem}}
/* always-there way back to the event's setup */
.backpill{position:fixed;left:calc(12px + env(safe-area-inset-left));bottom:calc(12px + var(--safe-b));z-index:40;background:var(--char);color:#fff;font:800 .875rem var(--body);text-decoration:none;padding:0 16px;min-height:44px;display:inline-flex;align-items:center;border-radius:999px;box-shadow:0 4px 14px #0003;max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.backpill.raised{bottom:calc(92px + var(--safe-b))}
.haspill .lane{padding-bottom:64px}
</style>
